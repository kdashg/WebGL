function xorshift32(v) {
	/* Algorithm "xor" from p. 4 of Marsaglia, "Xorshift RNGs" */
	v ^= v << 13;
	v ^= (v >> 17) & ( (1 << (32-17)) - 1 );
	v ^= v << 5;
	return v;
}

const GL = globalThis.WebGL2RenderingContext || WebGLRenderingContext;

/**
 * @param {string|GLenum} enum_str_or_val
 * @returns {GLenum}
 */
 function GL_(enum_str_or_val) {
    let ret = enum_str_or_val;
    if (typeof(ret) == 'string') {
        ret = GL[ret];
    }
    if (ret === undefined) throw enum_str_or_val;
    return ret;
}

// -

/**
 * @param {WebGLRenderingContext} gl
 * @param {string} target
 * @returns {WebGLBuffer}
 */
 function gl_createBufferData(gl, target, data, usage='STATIC_DRAW', ...more) {
    const ret = gl.createBuffer();
    gl.bindBuffer(GL_(target), ret);
    gl.bufferData(GL_(target), data, GL_(usage), ...more);
    ret.usage = usage;
    return ret;
}

// -

function jsobj_strinify(obj) {
    if (typeof(obj) == 'function') return `[function ${obj.name}]`;
    if (typeof(obj) != 'object') return ''+obj;
    if (obj.constructor == Object) {
        return '{' + Object.entries(obj).map(
            ([k, v]) => `${k}: ${jsobj_strinify(v)}`
        ).join(', ') + '}';
    }
    if (Array.isArray(obj)) {
        obj = obj.map(jsobj_strinify);
        return '[' + obj + ']';
    }
    if (ArrayBuffer.isView(obj)) {
        if (obj instanceof DataView) throw 'todo';
        const ctor = obj.constructor;
        obj = [].map.call(obj, jsobj_strinify);
        return `new ${ctor.name}([` + obj + `])`;
    }
    let ret = ''+obj;
    if (obj.label) {
        ret = ret.replace(']', ` "${obj.label}"]`);
    }
    return ret;
}

/**
 * @param {WebGL2RenderingContext} gl
 * @param {number} attrib_id
 * @param {GlVaoPerAttribState} state
 */
function gl_vertexAttribState(gl, attrib_id, state) {
    // For testing, set `divisor` even if `!is_array`.
    if (gl.vertexAttribDivisor) {
        gl.vertexAttribDivisor(attrib_id, state.divisor);
    } else if (state.divisor) {
        throw {gl, attrib_id, state};
    }

    state.is_array.defined;
    if (!state.is_array) {
        gl.disableVertexAttribArray(attrib_id);
    } else {
        gl.enableVertexAttribArray(attrib_id);
        state.vap.defined;
    }

    if (state.vap) {
        const vap = state.vap;

        vap.buffer.defined;
        gl.bindBuffer(gl.ARRAY_BUFFER, vap.buffer);

        vap.size.defined;
        vap.type.defined;
        vap.stride.defined;
        vap.offset.defined;
        if (vap.integer) {
            console.assert(!vap.normalized, {msg: '.integer && .normalized', gl, attrib_id, state});
            gl.vertexAttribIPointer(attrib_id, vap.size, GL_(vap.type),
                                    vap.stride || 0, vap.offset);
        } else {
            vap.normalized.defined;
            gl.vertexAttribPointer(attrib_id, vap.size, GL_(vap.type),
                                    vap.normalized, vap.stride || 0, vap.offset);
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
    }
}

const SYNC_CHECK_LOGS = false;

/**
 * @param {WebGLRenderingContext} gl
 * @param {string} type
 * @param {string} src
 * @returns {WebGLShader}
 */
function gl_compileShader2(gl, type, src) {
    src = src.trim();

    const s = gl.createShader(GL_(type));
    gl.shaderSource(s, src);
    gl.compileShader(s);

    if (SYNC_CHECK_LOGS) {
        const log = gl.getShaderInfoLog(s);
        console.assert(!log, {type, log, src});
    }

    return s;
}

// -

/**
 * @template T
 * @param {WebGLRenderingContext} gl
 * @param {string} type
 * @param {string|WebGLShader} src_or_shader
 * @param {(shader:WebGLShader) => Promise<T>} fn_with_compiled
 * @returns {T} from `fn_with_compiled`
 */
async function with_shader(gl, type, src_or_shader, fn_with_compiled) {
    let temp = null;
    let shader;
    if (typeof(src_or_shader) == 'string') {
        shader = temp = gl_compileShader2(gl, type, src_or_shader);
    } else {
        shader = src_or_shader;
    }

    const ret = await fn_with_compiled(shader);

    if (temp) {
        gl.deleteShader(temp);
    }

    return ret;
}

/**
 * @template T,U
 * @param {WebGLRenderingContext} gl
 * @param {string|WebGLShader} vs
 * @param {string|WebGLShader} fs
 * @param {(p:WebGLProgram) => Promise<T>} fn_with_unlinked
 * @param {(p:WebGLProgram) => Promise<U>} fn_with_linked
 * @returns {Promise<T|U>} Like `fn_with_unlinked() || fn_with_linked()`
 */
async function with_prog(gl, vs, fs, fn_with_unlinked, fn_with_linked) {
    const p = gl.createProgram();

    with_shader(gl, 'VERTEX_SHADER', vs, compiled => {
        p.vs = compiled;
        gl.attachShader(p, compiled);
    });
    with_shader(gl, 'FRAGMENT_SHADER', fs, compiled => {
        p.fs = compiled;
        gl.attachShader(p, compiled);
    });

    let ret;
    if (fn_with_unlinked) {
        ret = await fn_with_unlinked(p);
    }

    if (fn_with_linked && ret === undefined) {
        gl.linkProgram(p);

        if (SYNC_CHECK_LOGS) {
            const log = gl.getProgamInfoLog(p);
            console.assert(!log, {log, p});
        }

        ret = await fn_with_linked(p);
    }

    gl.deleteProgram(p);

    return ret;
}

function expr_uvec4_bitcast_from(glsl_type, glsl_ident) {
    let type_prefix = glsl_type[0];
    if (type_prefix == 'v') {
        type_prefix = 'f';
    }
    let args = [glsl_ident];
    if (glsl_type.includes('vec')) {
        const channels = parseInt(glsl_type[glsl_type.length-1]);
        args = range(channels).map(i => `${glsl_ident}[${i}]`);
    }
    let bitcast_fn = 'uint';
    if (type_prefix == 'f') {
        bitcast_fn = 'floatBitsToUint';
    }
    args = args.map(arg => `${bitcast_fn}(${arg})`);

    while (args.length < 4) {
        args.push(`0u`);
    }
    const expr = `uvec4(${args.join(', ')})`;
    //console.log({glsl_type, glsl_ident, bitcast_fn, expr});
    return expr;
}

const NORMALIZE_ALL = {
    denorms: true,
    neg_zero: true,
    infs: true,
    nans: true,
};

/**
 * @param {number} s_bits
 * @param {number} e_bits
 * @param {number} m_bits
 */
function make_float_info(s_bits, e_bits, m_bits) {
    const BIT_COUNTS = [s_bits, e_bits, m_bits];
    const S_MASK = bitsmask(s_bits) << (e_bits + m_bits);
    const E_MASK = bitsmask(e_bits) << m_bits;
    const M_MASK = bitsmask(m_bits);
    const E_BIAS = bitsmask(e_bits - 1);
    const E_INF_NAN = bitsmask(e_bits);
    const M_DIV = M_MASK + 1;
    return {
        BIT_COUNTS: BIT_COUNTS.slice(),
        S_MASK,
        E_MASK,
        M_MASK,
        E_BIAS,
        E_INF_NAN,
        M_DIV,

        split: (v) => {
            const ret = {s: 0, e: 0, m: 0, raw_e: 0, raw_m: 0};
            ret.raw_m = v & bitsmask(m_bits);
            v >>= m_bits;
            ret.raw_e = v & bitsmask(e_bits);
            v >>= e_bits;
            ret.s = v & bitsmask(s_bits);

            ret.e = ret.raw_e - E_BIAS;
            ret.m = 1 + (ret.raw_m / M_DIV);
            return ret;
        },

        /** @type {(packed:number,options=NORMALIZE_ALL) => number} */
        normalize: (packed, options=NORMALIZE_ALL) =>  {
            if (options.denorms && (packed & E_MASK) == 0) {
                // Flush to zero.
                packed &= S_MASK;
            }
            if ((packed & E_MASK) == E_MASK) {
                if (options.infs && (packed & M_MASK) == 0) {
                    packed ^= 1 << m_bits;
                    packed |= M_MASK;
                    //packed ^= bitsmask(1+m_bits);
                } else if (options.nans && (packed & M_MASK) != 0) {
                    packed ^= 1 << m_bits;
                }
            }
            if (options.neg_zero && packed == S_MASK) {
                packed = 0;
            }
            return packed;
        },
    };
}

const F16_INFO = make_float_info(1, 5, 10);
const F32_INFO = make_float_info(1, 8, 23);

const FLOAT_INFO_BY_CTOR = new Map([
    [Float16Array, F16_INFO],
    [Float32Array, F32_INFO],
]);

// -

/**
 * @param {TypedArray} dest
 * @returns {TypedArray} - Returns dest, modified in-place.
 */
function remapToRealValues(dest, options=NORMALIZE_ALL) {
    const float_info = FLOAT_INFO_BY_CTOR.get(dest.constructor);
    if (float_info) {
        // Float16Array -> Uint16Array
        const uint_view_ctor = globalThis[dest.constructor.name.replace('Float', 'Uint')];
        const uint_view = abv_cast(uint_view_ctor, dest);
        for (const i of range(uint_view.length)) {
            const was = uint_view[i];
            const now = float_info.normalize(was, options);
            const now2 = float_info.normalize(now, options);
            if (now != now2) throw {was, now, now2};
            uint_view[i] = now;
        }
    }
    return dest;
}

function type_prefix_from_glsl_type(glsl_type) {
    // Good news! We don't have to test bools:
    // Vertex inputs (attribs) can't be boolean types, opaque types, arrays, or structs.
    // (ESSL 3.0 spec $4.3.4 "Input Variables")
    // This function still handles them `(bool | bvec4) => b`,
    // but for e.g. uniforms, bools can be sent any of f/i/u.
    let type_prefix = glsl_type[0];
    if ('vm'.includes(type_prefix)) {
        // E.g. (f)vec4, (f)mat4.
        type_prefix = 'f';
    }
    return type_prefix;
}
console.assert('b' == type_prefix_from_glsl_type('bool'));
console.assert('b' == type_prefix_from_glsl_type('bvec4'));
console.assert('f' == type_prefix_from_glsl_type('float'));
console.assert('f' == type_prefix_from_glsl_type('vec4'));
console.assert('f' == type_prefix_from_glsl_type('mat4'));
console.assert('i' == type_prefix_from_glsl_type('int'));
console.assert('i' == type_prefix_from_glsl_type('ivec4'));
console.assert('u' == type_prefix_from_glsl_type('uint'));
console.assert('u' == type_prefix_from_glsl_type('uvec4'));

function to_hexes(vals) {
    return [].map.call(vals, v => `0x${v.toString(16)}`).join(', ');
}

call(async () => {
    const DRNG = getDrng();
    const MAX_BUFFER_FETCH_ID = 100_000;

    const gl = document.createElement('canvas').getContext('webgl2');
    globalThis._gl = gl;
    const jsgl = new JSGL(gl);
    const MAX_VERTEX_ATTRIBS = gl.getParameter(GL.MAX_VERTEX_ATTRIBS);

    // -

    const BUFFER_BY_DATA_CTOR = new Map(
        [
            Float16Array,
            Float32Array,
            Uint32Array,
        ].map(ctor => {
            const data = new ctor(4*MAX_BUFFER_FETCH_ID);
            DRNG.getRandomValues(data);
            remapToRealValues(data);

            const buffer = gl_createBufferData(gl, 'ARRAY_BUFFER', data);
            buffer.label = ctor.name;
            return [ctor, buffer];
        })
    );

    // -

    // VAV: e.g. VertexAttrib4fV, aka Vertex Attrib Values
    /** @type {Map.<string,{ prefix_type:string, fn:(this:WebGL2RenderingContext, ...args) => void, data: TypedArray}>} */
    const VAV_INFO_BY_PREFIX_TYPE = new Map(
        [
            {prefix_type: 'f', gl_vertexAttrib4v: gl.vertexAttrib4fv  , data: Float32Array},
            {prefix_type: 'i', gl_vertexAttrib4v: gl.vertexAttribI4iv , data: Int32Array  },
            {prefix_type: 'u', gl_vertexAttrib4v: gl.vertexAttribI4uiv, data: Uint32Array },
        ].map(
            info => {
                info.data = new info.data(4);
                DRNG.getRandomValues(info.data);
                remapToRealValues(info.data);
                return [info.prefix_type, info];
            }
        )
    );

    // -

    // VAP means VertexAttribI?Pointer.
    // vap(integer:false) => vertexAttribPointer
    // vap(integer:true ) => vertexAttribIPointer

    // vap(type:BYTE,integer:true) => load<i8>(), e.g. 0x7f => +127i
    // vap(type:BYTE,integer:true) => load<i8>(), e.g. 0x80 => -128i

    // vap(type:BYTE,integer:false,normalized:false) => load<i8>()*1.0f, e.g. 0x7f => +127.0f
    // vap(type:BYTE,integer:false,normalized:false) => load<i8>()*1.0f, e.g. 0x80 => -128.0f

    // vap(type:BYTE,integer:false,normalized:true) => max(-127,load<i8>())/127, e.g. 0x7e =>~+0.99f
    // vap(type:BYTE,integer:false,normalized:true) => max(-127,load<i8>())/127, e.g. 0x7f => +1.00f
    // vap(type:BYTE,integer:false,normalized:true) => max(-127,load<i8>())/127, e.g. 0x80 => -1.00f (clamped)
    // vap(type:BYTE,integer:false,normalized:true) => max(-127,load<i8>())/127, e.g. 0x81 => -1.00f
    // vap(type:BYTE,integer:false,normalized:true) => max(-127,load<i8>())/127, e.g. 0x82 =>~-0.99f
    // vap(type:BYTE,integer:false,normalized:true) => max(-127,load<i8>())/127, e.g. 0x00 =>  0.00f

    const VAP_VARIANTS = [].concat(
        crossCombine(
            [
                'FLOAT',
                'HALF_FLOAT',
            ].map(type => ({type})),
            [1,2,3,4].map(size => ({size})),
            [
                {integer: false, normalized: false},
                //{integer: false, normalized: true}, // Should have no effect
            ]
        ),

        crossCombine(
            [
                'BYTE',
                'SHORT',
                'UNSIGNED_BYTE',
                'UNSIGNED_SHORT',
                'INT',
                'UNSIGNED_INT',
            ].map(type => ({type})),
            [1,2,3,4].map(size => ({size})),
            [
                {integer: false, normalized: false    },
                {integer: false, normalized: true     },
                {integer: true , normalized: undefined},
            ]
        ),

        crossCombine(
            [
                'INT_2_10_10_10_REV',
                'UNSIGNED_INT_2_10_10_10_REV',
            ].map(type => ({type})),
            [{size: 4, integer: false}],
            [true, false].map(normalized => ({normalized}))
        )
    );

    // Sort by f/i/u, because we can't feed e.g. `FLOAT` into `int`.
    // Pick the right buffer too. We don't want to 'cast' u32-to-f32,
    // since that would sometimes give e.g. non-finites.
    const VAP_VARIANTS_BY_TYPE_PREFIX = new Map(
        ['f', 'i', 'u'].map(type_prefix => [type_prefix, []])
    );
    for (const vap of VAP_VARIANTS) {
        let type_prefix = 'f';
        if (vap.integer) {
            if (vap.type.includes('UNSIGNED')) {
                type_prefix = 'u';
            } else {
                type_prefix = 'i';
            }
        }
        const vaps = VAP_VARIANTS_BY_TYPE_PREFIX.get(type_prefix);
        vaps.push(vap);

        const DATA_CTOR_OVERRIDE_BY_ATTRIB_TYPE = {
            'FLOAT': Float32Array,
            'HALF_FLOAT': Float16Array,
        };
        const data_ctor = DATA_CTOR_OVERRIDE_BY_ATTRIB_TYPE[vap.type] || Uint32Array;

        vap.buffer = BUFFER_BY_DATA_CTOR.get(data_ctor) || throwv({data_type, vap});
        vap._type_prefix = type_prefix;
    }

    // -

    let DIVISORS = [0];
    DIVISORS = [0, 1, Math.pow(2,31), Math.pow(2,32)-1];

    const PER_ATTRIB_DRAWTIME_COMBOS = crossCombine(
        //range(MAX_VERTEX_ATTRIBS).map(attrib_id => ({attrib_id})),
        DIVISORS.map(divisor => ({divisor})),
        [false, true].map(is_array => ({is_array}))
    );

    let VERT_ID = [
        0, 1, MAX_BUFFER_FETCH_ID-1,
        //Math.pow(2,30),
        //Math.pow(2,31)-1,
    ];
    let INST_ID = [0, 1, MAX_BUFFER_FETCH_ID-1];

    const DRAW_CALL_COMBOS = crossCombine(
        VERT_ID.map(vert_id => ({vert_id})),
        INST_ID.map(inst_id => ({inst_id}))
    )

    // -

    const fb = gl.createFramebuffer();

    fb.tex = gl.createTexture();
    fb.tex.format = 'RGBA32UI';
    gl.bindTexture(gl.TEXTURE_2D, fb.tex);
    fb.tex.mip_levels = 1;
    fb.tex.w = fb.tex.h = 1;
    gl.texStorage2D(gl.TEXTURE_2D, fb.tex.mip_levels, gl[fb.tex.format], fb.tex.w, fb.tex.h);
    gl.bindTexture(gl.TEXTURE_2D, null);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fb.tex, 0);
    fb.w = fb.tex.w;
    fb.h = fb.tex.h;
    gl.viewport(0, 0, fb.w, fb.h);

    let PBO = null;
    if (gl.PIXEL_PACK_BUFFER) {
        PBO = gl_createBufferData(gl, gl.PIXEL_PACK_BUFFER, 1_000_000, 'STREAM_READ');
    }

    function clearBuffer() {
        gl.clearBufferuiv(gl.COLOR, 0, [0,0,0,0]);
    }
    function readPixel(dest) {
        //console.log('readPixels', {dest});
        gl.readPixels(0, 0, 1, 1, gl.RGBA_INTEGER, gl.UNSIGNED_INT, dest);
    }

    const FAKE_NULL_BUFFER = gl_createBufferData(gl, 'ARRAY_BUFFER', 1);
    const INIT_VERTEX_ATTRIB_STATE = {
        divisor: 0,
        is_array: false,
        vap: {
            integer: false,
            type: 'FLOAT',
            size: 4,
            normalized: false,
            stride: 0,
            offset: 0,
            buffer: FAKE_NULL_BUFFER,
        },
    };

    // -

    async function test_with(attrib_ids, glsl_types) {
        debug(`\

        attrib_ids: [${attrib_ids}]
        glsl_types: [${glsl_types}]`);

        // The big reason we can't test *everything*: This part is O(2^N):
        /**
         * @typedef {{attrib_id:number, glsl_type:string}} AttribConfig
         * @typedef {string} AttribName
         * @typedef {object.<AttribName,AttribConfig>} ShaderConfig
         * @type {ShaderConfig[]}
         */
        let shader_configs = [{}];
        debug('(building shader_configs)')
        let i = 0;
        for (const attrib_id of attrib_ids) {
            i += 1;
            const attrib_configs_for_attrib_id = glsl_types.map(glsl_type => ({attrib_id, glsl_type}));
            const new_shader_configs_for_attrib_id = attrib_configs_for_attrib_id.map(
                attrib_config => Object.fromEntries([[`attrib${attrib_id}`, attrib_config]])
            );
            shader_configs = crossCombine(
                shader_configs,
                new_shader_configs_for_attrib_id
            );
            debug(`(stage ${i}/${attrib_ids.length} shader_configs.length: ${shader_configs.length})`);
            await new Promise(go => setTimeout(go, 0));
        }

        // -

        debug(`\
        shader_configs.length: ${shader_configs.length}`);
        for (const shader_config of shader_configs) {
            /** @type {AttribConfig[]} */
            const attribs = Object.values(shader_config);

            debug(`\
            attribs: ${jsobj_strinify(attribs)}`);

            for (const i of range(MAX_VERTEX_ATTRIBS)) {
                gl.vertexAttrib4fv(i, [0,0,0,0]);
                gl_vertexAttribState(gl, i, INIT_VERTEX_ATTRIB_STATE);
            }

            // -

            // Init attribs.
            const glsl_type_by_attrib_id = {};
            for (const attrib of attribs) {
                const attrib_id = attrib.attrib_id;
                glsl_type_by_attrib_id[attrib_id] = attrib.glsl_type;

                const type_prefix = type_prefix_from_glsl_type(attrib.glsl_type);
                const vaps = VAP_VARIANTS_BY_TYPE_PREFIX.get(type_prefix);
                const vav = VAV_INFO_BY_PREFIX_TYPE.get(type_prefix);

                 // Any valid VAP is ok for this init pass.
                const any_valid_vap = vaps[0] || throwv({vaps});
                const state = {
                    divisor: 0,
                    is_array: false,
                    vap: any_valid_vap,
                };
                gl_vertexAttribState(gl, attrib_id, INIT_VERTEX_ATTRIB_STATE);

                vav.gl_vertexAttrib4v.call(gl, attrib_id, vav.data);
            }

            // -

            await with_prog_for_shader_config(gl, glsl_type_by_attrib_id, async prog => {
                debug(`\
                attribs.length: ${attribs.length}`);
                for (const attrib of attribs) {
                    debug(`\
                    attrib: ${jsobj_strinify(attrib)}`);
                    await new Promise(go => setTimeout(go, 0));

                    const attrib_id = attrib.attrib_id;
                    prog.u_select_attrib_id(attrib_id);

                    const glsl_type = attrib.glsl_type;
                    const type_prefix = type_prefix_from_glsl_type(glsl_type);
                    const glsl_channels = glsl_type.includes('vec') ? glsl_type[glsl_type.length-1] : 1;
                    const vaps = VAP_VARIANTS_BY_TYPE_PREFIX.get(type_prefix);
                    const vav = VAV_INFO_BY_PREFIX_TYPE.get(type_prefix);

                    const vap_xor_vav_configs = [].concat(
                        [{is_array: false, vav}],
                        vaps.map(vap => ({
                            is_array: true,
                            vap: Object.assign({stride: 0, offset: 0}, vap),
                        })),
                    );
                    const fetch_configs = crossCombine(
                        DIVISORS.map(divisor => ({divisor})),
                        vap_xor_vav_configs,
                        DRAW_CALL_COMBOS
                    );
                    debug(`\
                    fetch_configs.length: ${fetch_configs.length}`);
                    let fetch_config_i = -1;
                    const results = new Array(fetch_configs.length);
                    const bytes_per_pixel = 4 * Uint32Array.BYTES_PER_ELEMENT;
                    const cpu_read_pixels_data_size = bytes_per_pixel * fetch_configs.length;
                    let cpu_read_pixels_data = null;
                    if (!PBO) {
                        cpu_read_pixels_data = new Uint8Array(cpu_read_pixels_data_size);
                    }
                    let cached_gl_fetch_state = null;
                    if (1) {
                        cached_gl_fetch_state = jsgl.get_gl_fetch_state(gl);
                    }
                    const fetch_configs_begin = performance.now();
                    let next_await = fetch_configs_begin + 200;
                    for (const [i,fetch_config] of Object.entries(fetch_configs)) {
                        const now = performance.now();
                        if (next_await <= now || i % 100 == 0) {
                            next_await = now + 200;
                            await new Promise(go => setTimeout(go, 0));
                        }

                        const status = `fetch_config ${+i+1}/${fetch_configs.length}`;
                        e_status.textContent = status;
                        //debug(`
                        //${status}: ${jsobj_strinify(fetch_config)}`);

                        clearBuffer();

                        gl_vertexAttribState(gl, attrib_id, fetch_config);
                        if (cached_gl_fetch_state) {
                            cached_gl_fetch_state.vao.attribs[attrib_id] = fetch_config;
                        }

                        prog.u_select_instance_id(fetch_config.inst_id);
                        const vert_count = 1;
                        const inst_count = fetch_config.inst_id+1;
                        gl.drawArraysInstanced(GL.POINTS, fetch_config.vert_id, vert_count, inst_count);

                        let dest = bytes_per_pixel * i;
                        if (cpu_read_pixels_data) {
                            dest = cpu_read_pixels_data.subarray(dest, dest + bytes_per_pixel);
                            dest = abv_cast(Uint32Array, dest);
                        }

                        readPixel(dest);

                        const expected_fetch = jsgl.fetch_attrib(cached_gl_fetch_state || gl, attrib_id,
                            fetch_config.vert_id, fetch_config.inst_id);
                        console.assert([1, 2].includes(expected_fetch.length), expected_fetch);
                        //console.log({expected_fetch});
                        const expected_vert_input = expected_fetch.map(
                            vals => vals.map(
                                (val, i) => i < glsl_channels ? val : 0
                            )
                        );

                        results[i] = {
                            expected_vert_input,
                        };
                    }
                    await new Promise(go => setTimeout(go, 0));

                    if (!cpu_read_pixels_data) {
                        cpu_read_pixels_data = new Uint8Array(cpu_read_pixels_data_size);
                        gl.getBufferSubData(GL.PIXEL_PACK_BUFFER, 0, cpu_read_pixels_data);
                    }
                    const cpu_read_pixels_u32s = abv_cast(Uint32Array, cpu_read_pixels_data);

                    const fetch_configs_ms = performance.now() - fetch_configs_begin;
                    const fcps = fetch_configs.length / (fetch_configs_ms / 1000);
                    debug(`(${fetch_configs.length} fetch_configs / ${fetch_configs_ms}ms => ${fcps} fcps)`);

                    const err = gl.getError();
                    if (err) throw {err};

                    for (const [i,fetch_config] of Object.entries(fetch_configs)) {
                        const was_u32s = cpu_read_pixels_u32s.subarray(4*i, 4*i+4);
                        const was_f32s = abv_cast(Float32Array, was_u32s);

                        const expected_vert_input = results[i].expected_vert_input;
                        const mins = expected_vert_input[0];
                        const maxs = expected_vert_input[1];
                        const was = abv_cast(expected_vert_input[0].constructor, was_u32s);
                        if (!maxs) {
                            const exact_u32s = abv_cast(Uint32Array, mins);
                            let ok = shouldBe(`'[${to_hexes(was_u32s)}]'`, `'[${to_hexes(exact_u32s)}]'`);
                            if (!ok) {
                                debug(`was: u32s: [${was_u32s}], f32s: [${was_f32s}]`);
                                debug(`exact: u32s: [${exact_u32s}], f32s: [${abv_cast(Float32Array, exact_u32s)}]`);
                            }
                        } else {
                            let ok = false;
                            for (const i of range(4)) {
                                ok &= shouldBeTrue(`[${mins}][${i}] <= ${was[i]} && ${was[i]} <= [${maxs}][${i}]`);
                            }
                            if (!ok) {
                                debug(`mins: u32s: [${abv_cast(Uint32Array, mins)}], f32s: [${abv_cast(Float32Array, mins)}]`);
                                debug(`was: u32s: [${was_u32s}], f32s: [${was_f32s}]`);
                                debug(`maxs: u32s: [${abv_cast(Uint32Array, maxs)}], f32s: [${abv_cast(Float32Array, maxs)}]`);
                            }
                        }
                    } // fetch_configs
                } // attribs
                //throw 'good so far';
            }); // with_prog_for_shader_config
        } // shader_configs
    } // test_with

    // -

    const FULL_ATTRIB_GLSL_TYPES = [
        'float',
        'vec2',
        'vec3',
        'vec4',
        'int',
        'ivec2',
        'ivec3',
        'ivec4',
        'uint',
        'uvec2',
        'uvec3',
        'uvec4',
    ];
    const VEC4_ATTRIB_GLSL_TYPES = FULL_ATTRIB_GLSL_TYPES.filter(x => x.endsWith('4'));

    const FEWER_ATTRIB_IDS_LIST = [
        [0],
        [1],
        [0,1],
        [1,2],
        [0,MAX_VERTEX_ATTRIBS-1],
        [1,MAX_VERTEX_ATTRIBS-1],
    ];
    debug(`\
    FEWER_ATTRIB_LOCS_LIST.length: ${FEWER_ATTRIB_IDS_LIST.length}`);
    for (const attrib_ids of FEWER_ATTRIB_IDS_LIST) {
        break;
        await test_with(attrib_ids, FULL_ATTRIB_GLSL_TYPES);
        break;
    }

    const FULL_ATTRIB_IDS = range(MAX_VERTEX_ATTRIBS-2); // MAX-2 because of gl_VertexID and gl_InstanceID use.
    // Only do full test with one type, as all three is 3^16 => shader_configs.length: 43046721
    for (const glsl_type of VEC4_ATTRIB_GLSL_TYPES) {
        await test_with(FULL_ATTRIB_IDS, [glsl_type]);
    }

    finishTest();
});

// -

debug("");
var successfullyParsed = true;

</script>
